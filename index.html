<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home TV App</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>
    <div class=" fixed-nav">
        <nav class=" frost-navbar">
            <ul class="frost-links">
                <li> <a aria-current="page" href="index.html"><i class="fa-solid fa-house"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-cloud-moon"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-cake-candles"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i></a></li>
            </ul>
        </nav>
    </div>

    <div class="content">

        <div class="row ">

            <div class="col-4 " id="left">
                <p class="display-6 text-light text-center">Welcome Home!</p>

                <div class="clock-container mt-4">
                    <div class="analog-clock">
                        <div class="solar-trail" id="solarTrail"></div>
                        <div class="digital-time" id="digitalTime">
                            00:00
                        </div>
                        <!-- <div class="second-dot" id="secondDot"></div> -->
                    </div>
                </div>
                <div class="date-box mt-3">
                    <p id="day" class="fs-4 fw-semibold"></p>
                    <span>|</span>
                    <p id="date" class="fs-5 fw-light"></p>
                </div>
            </div>

            <div class="col-4 xbg-secondary" id="mid">
                <p>test</p>
            </div>

            <div class="col-4 xbg-light" id="right">

            </div>

        </div>








    </div>

    <!-- All scripts should be placed at the end of the body to improve page load performance -->
    <script src="./js/clock.js"></script>
    <script src="./js/date.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
