<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #0d47a1 0%, #1976d2 25%, #42a5f5 50%, #81d4fa 75%, #b3e5fc 100%);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

.card {
background: rgba(255,255,255,0.92);
border-radius: 30px;
padding: 40px 30px;
max-width: 500px;
width: 100%;
text-align: center;
box-shadow: 0 20px 60px rgba(13,71,161,0.35);
border: 3px solid #90caf9;
position: relative;
z-index: 2;
}

h1 {
font-size: 2rem;
color: #1565c0;
margin: 0 0 5px;
text-shadow: 2px 2px 0 #b3e5fc;
}
.name {
font-size: 1.3rem;
color: #01579b;
margin-bottom: 10px;
}

.balloon-img-row {
display: flex;
justify-content: center;
align-items: flex-end;
gap: 10px;
margin-bottom: 8px;
}
.balloon-img-row .balloon-svg {
filter: drop-shadow(0 6px 6px rgba(13,71,161,0.25));
animation: bob 3s ease-in-out infinite;
}
.balloon-img-row .balloon-svg:nth-child(2) { animation-delay: 0.5s; }
.balloon-img-row .balloon-svg:nth-child(3) { animation-delay: 1s; }

.mascot-row {
margin: 6px 0 4px;
}
.mascot-row svg {
filter: drop-shadow(0 8px 10px rgba(13,71,161,0.3));
animation: pupBounce 2.4s ease-in-out infinite;
}
@keyframes pupBounce {
0%, 100% { transform: translateY(0) rotate(-2deg); }
50% { transform: translateY(-8px) rotate(2deg); }
}
.mascot-tail {
transform-origin: 90px 70px;
animation: wag 0.6s ease-in-out infinite;
}
@keyframes wag {
0%, 100% { transform: rotate(-15deg); }
50% { transform: rotate(15deg); }
}

.balloon-row {
font-size: 2.5rem;
margin-bottom: 10px;
animation: bob 3s ease-in-out infinite;
}
@keyframes bob {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}

.countdown {
display: flex;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
margin: 25px 0;
}
.box {
background: linear-gradient(160deg, #42a5f5, #1565c0);
border-radius: 18px;
padding: 15px 10px;
min-width: 70px;
box-shadow: 0 6px 0 #0d47a1, 0 10px 20px rgba(0,0,0,0.15);
}
.box .num {
font-size: 2.2rem;
font-weight: bold;
color: #fff;
text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
display: block;
}
.box .label {
font-size: 0.75rem;
color: #fff;
text-transform: uppercase;
letter-spacing: 1px;
}

.message {
font-size: 1.1rem;
color: #4a4a4a;
margin-top: 10px;
min-height: 30px;
}

.turning {
font-size: 1.4rem;
color: #ff5e78;
font-weight: bold;
margin-top: 15px;
}

.party-mode {
display: none;
}
.party-mode.active {
display: block;
}
.party-mode h1 {
font-size: 2.5rem;
color: #0d47a1;
animation: pulse 1s ease-in-out infinite;
}
.turning {
color: #1565c0 !important;
}
@keyframes pulse {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.08); }
}

.normal-mode.hidden { display: none; }

.confetti {
position: fixed;
top: -20px;
font-size: 1.5rem;
animation: fall linear infinite;
z-index: 1;
pointer-events: none;
}
@keyframes fall {
to { transform: translateY(110vh) rotate(360deg); }
}
</style>

</head>

<script>
  // Set target birthday: September 11 (next occurrence)
  function getNextBirthday() {
    const now = new Date();
    let year = now.getFullYear();
    let birthday = new Date(year, 8, 11, 0, 0, 0); // month is 0-indexed: 8 = September
    if (now > birthday) {
      // if today is past Sept 11 this year, but check if it's still the same day
      const endOfBirthday = new Date(year, 8, 11, 23, 59, 59);
      if (now > endOfBirthday) {
        birthday = new Date(year + 1, 8, 11, 0, 0, 0);
      }
    }
    return birthday;
  }

  function isBirthdayToday() {
    const now = new Date();
    return now.getMonth() === 8 && now.getDate() === 11;
  }

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const normalView = document.getElementById('normalView');
  const partyView = document.getElementById('partyView');

  function launchConfetti() {
    const emojis = ['🎉','💙','🎂','🎁','⭐','🥳','🔵'];
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (2 + Math.random() * 3) + 's';
      el.style.animationDelay = (Math.random() * 2) + 's';
      document.body.appendChild(el);
    }
  }

  function update() {
    if (isBirthdayToday()) {
      normalView.classList.add('hidden');
      partyView.classList.add('active');
      if (!window.confettiLaunched) {
        launchConfetti();
        window.confettiLaunched = true;
      }
      return;
    }

    const target = getNextBirthday();
    const now = new Date();
    const diff = target - now;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    daysEl.textContent = days;
    hoursEl.textContent = hours;
    minutesEl.textContent = minutes;
    secondsEl.textContent = seconds;
  }

  update();
  setInterval(update, 1000);
</script>
